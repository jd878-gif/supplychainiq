# The daily pipeline: ingestion -> Silver + DQ -> Gold -> validation.
# No cluster is specified, so every task runs on serverless jobs compute.
resources:
  jobs:
    supplychainiq_daily:
      name: supplychainiq_daily
      max_concurrent_runs: 1          # overlapping runs would race on checkpoints and CDC watermarks
      performance_target: STANDARD    # daily SLA: cheaper standard serverless, not performance-optimized
      parameters:
        - name: catalog
          default: ${var.catalog}
      email_notifications:
        on_failure:
          - ${var.notify_email}
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"   # 06:00 daily
        timezone_id: America/New_York
        pause_status: PAUSED                    # unpause only while Postgres is running
      tasks:
        - task_key: bronze_pos
          notebook_task: {notebook_path: ../notebooks/databricks/10_bronze_pos.ipynb}
          max_retries: 2                        # absorbs the one-time stop on a new column (schema evolution)
          min_retry_interval_millis: 60000
          timeout_seconds: 3600
        - task_key: bronze_csv
          notebook_task: {notebook_path: ../notebooks/databricks/11_bronze_csv.ipynb}
          max_retries: 2
          min_retry_interval_millis: 60000
          timeout_seconds: 3600
        - task_key: cdc_postgres
          notebook_task: {notebook_path: ../notebooks/databricks/40_cdc_postgres.ipynb}
          max_retries: 1                        # absorbs a brief source-DB connection blip
          min_retry_interval_millis: 120000
          timeout_seconds: 3600

        - task_key: silver_pos
          depends_on: [{task_key: bronze_pos}]
          notebook_task: {notebook_path: ../notebooks/databricks/20_silver_pos.ipynb}
          max_retries: 1
          timeout_seconds: 3600
        - task_key: silver_inventory
          depends_on: [{task_key: bronze_csv}]
          notebook_task: {notebook_path: ../notebooks/databricks/21_silver_inventory.ipynb}
          max_retries: 1
          timeout_seconds: 3600
        - task_key: silver_shipments
          depends_on: [{task_key: bronze_csv}]
          notebook_task: {notebook_path: ../notebooks/databricks/22_silver_shipments.ipynb}
          max_retries: 1
          timeout_seconds: 3600
        - task_key: dq_completeness
          depends_on: [{task_key: silver_pos}]
          notebook_task: {notebook_path: ../notebooks/databricks/23_dq_completeness.ipynb}
          timeout_seconds: 1800

        - task_key: gold_sales
          depends_on: [{task_key: silver_pos}, {task_key: silver_inventory}]
          notebook_task: {notebook_path: ../notebooks/databricks/30_gold_sales_inventory.ipynb}
          timeout_seconds: 5400
        - task_key: supplier_scorecard
          depends_on: [{task_key: gold_sales}, {task_key: silver_shipments}, {task_key: cdc_postgres}]
          notebook_task: {notebook_path: ../notebooks/databricks/31_gold_supplier_scorecard.ipynb}
          timeout_seconds: 1800

        - task_key: validation
          depends_on: [{task_key: dq_completeness}, {task_key: supplier_scorecard}]
          notebook_task: {notebook_path: ../notebooks/databricks/90_validation_ground_truth.ipynb}
          timeout_seconds: 1800
